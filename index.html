<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-программирование | ЛР №1</title>

    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    
    <header class="header">
        <p class="header-data">Саньков Андрей Андреевич</p>
        <p class="header-data">Вариант: 12695</p>
        <p class="header-data">Группа: P3212</p>
    </header>

    <main class="main">

        <section class="main-section">
            <form id="shoot__form" novalidate data-js-shoot-form>
                <fieldset class="shoot-form-fieldset">
                    <legend class="shoot-form-legend">Параметры выстрела</legend>
                    
                    <p class="field">
                        <label for="select-x" class="field-label">Изменение X:</label>
                        <select 
                            class="select-x"
                            name="coordinate__x" 
                            id="select-x" 
                            aria-errormessage="select-x-errors"
                            required
                        >
                            <option class="option-x" value="" disabled selected></option>
                            <option class="option-x" value="-3">-3</option>
                            <option class="option-x" value="-2">-2</option>
                            <option class="option-x" value="-1">-1</option>
                            <option class="option-x" value="0">0</option>
                            <option class="option-x" value="1">1</option>
                            <option class="option-x" value="2">2</option>
                            <option class="option-x" value="3">3</option>
                            <option class="option-x" value="4">4</option>
                            <option class="option-x" value="5">5</option>
                        </select>
                        <span id="select-x-errors" class="field__errors" data-js-form-field-errors></span>
                    </p>

                    <p class="field">
                        <label for="select-y" class="field-label">Изменение Y:</label>
                        <input 
                            type="text" 
                            id="select-y"
                            name="coordinate__y"
                            pattern="-?[0-9]+"
                            title="Указанное значение должно быть числом"
                            aria-errormessage="select-y-errors"
                            required   
                        >
                        <span id="select-y-errors" class="field__errors" data-js-form-field-errors></span>
                    </p>

                    <div class="field">
                        <label class="field-label">Изменение R:</label>
                        <ul type="none" class="button-R-list">
                            <li><button type="button" id="button-r" class="button-R" value="1">1</button></li>
                            <li><button name="btn-R-field" type="button" class="button-R" value="2">2</button></li>
                            <li><button name="btn-R-field" type="button" class="button-R" value="3">3</button></li>
                            <li><button name="btn-R-field" type="button" class="button-R" value="4">4</button></li>
                            <li><button name="btn-R-field" type="button" class="button-R" value="5">5</button></li>
                        </ul>
                        <div class="field__errors" data-js-form-field-errors data-js-select-r-errors></div>
                    </div>

                    <div class="btn-shoot-wrapper">
                        <button type="submit" class="button-shoot">ВЫСТРЕЛ!</button>
                    </div>

                </fieldset>
            </form>
        </section>

        <section class="main-section">
            <canvas id="canvas-graphics" width="400" height="400"></canvas>
        </section>

        <section class="main-section">
            <table class="shoots-table">
                <thead class="shoot-table-header">
                    <tr class="shoot-table-row">
                        <th>Дата</th>
                        <th>Время</th>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                    </tr>
                </thead>
                <tbody class="shoot-list" data-js-shoot-list>
                    <!-- JavaScript code -->
                </tbody>
            </table>

            <div class="clear-button-wrapper">
                <button type="button" class="clear-button" data-js-clear-button>Очистить таблицу</button>
            </div>
        </section>

    </main>

    <script src="./script.js"></script>

</body>
</html>
