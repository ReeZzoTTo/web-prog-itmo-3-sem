<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Sen:wght@400..800&display=swap');

        :root {
            --input-field-max-width: 40px;
            --dark-blue-color: rgb(0, 35, 110);
            --dark-blue-color-2: rgb(0, 27, 58);
            --light-blue-color: #81b3ff;
            --sky-blue-color: #a2c7ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: var(--dark-blue-color);
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        
        .noto-sans-font {
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }

        input, select, button {
            background-color: inherit;
            font-family: inherit;
            font-weight: inherit;
            border: none;
        }

        #shoot__form {
            margin: 0;
            padding: 0;
            text-align: left;
            /* box-sizing: border-box; */
        }

        fieldset {
            /* border: 1px solid black; */
            padding-inline: 30px;
        }

        legend {
            text-align: center;
        }

        #main-table {
            table-layout: fixed;
            width: 100%;
            border: black 1px solid;
        }

        #main-table .main-thead {
            font-family: monospace;
            font-size: 32px;
            background-color: #7dc4ff;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.15);
        }

        #main-table .main-tbody {
            font-size: 24px;
        }

        td {
            width: min-content;
            padding: 15px;
            border: 1px solid black;
        }

        #main-table .main-thead tr td:first-child {
            text-align: center;
        }

        #main-table .main-thead tr td:nth-child(2) {
            text-align: center;
        }

        #main-table .main-thead tr td:last-child {
            text-align: right;
        }


        #main-table .main-tbody tr td {     
            padding-block: 100px;
            /* display: flex; */
            text-align: center;
        }
        
        #select-x, #select-y {
            min-width: var(--input-field-max-width);
            width: calc(var(--input-field-max-width) + 15px);
            font-size: 20px;
            padding: 5px;
            background-color: #dadada;
            border-radius: 5px;
            border: 1px solid white;
        }

        #select-y {
            width: calc(var(--input-field-max-width) + 5px);
        }
        
        select option {
            font-size: 20px;
        }  

        ul {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-evenly;
        }

        li button {
            width: 3em;
            font-size: 24px;
        }

        #btn-shoot-wrapper {
            display: flex;
            justify-content: center;
            
        }

        .field__error {
            display: block;
            font-size: 16px;
            color: red;
        }

        #btn-shoot-wrapper button {
            font-size: 24px; 
            padding: 15px 25px;
        }

        button {
            background-color: var(--light-blue-color);
            border-radius: 5px;
            color: var(--dark-blue-color-2);
            transition: 0.4s;
        }

        button:hover {
            scale: 1.1;
            box-shadow: 0px 8px 10px rgba(0,0,0,0.15);
            background-color: #a2c7ff
        }

        .button-R {
            border: 1px solid transparent;
        }

        .btn-active {
            border-color: var(--dark-blue-color);
            background-color: var(--sky-blue-color);
        }

    </style>
</head>
<body>
    
    <table id="main-table">
        <thead class="main-thead">
            <tr>
                <td>Саньков Андрей Андреевич</td>
                <td>Вариант: 12695</td>
                <td>Группа: P3212</td>
            </tr>
        </thead>
        <tbody class="main-tbody">
            <tr>
                <td>
                    <form id="shoot__form" novalidate data-js-shoot-form>
                        <fieldset>
                            <legend>Параметры выстрела</legend>
                            
                            <p class="field">
                                <label for="select-x">Изменение X:</label>
                                <select 
                                    name="coordinate__x" 
                                    id="select-x" 
                                    aria-errormessage="select-x-errors"
                                    required
                                >
                                    <option value="" disabled selected></option>
                                    <option value="-3">-3</option>
                                    <option value="-2">-2</option>
                                    <option value="-1">-1</option>
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <span id="select-x-errors" class="field__errors" data-js-form-field-errors></span>
                            </p>

                            <p class="field">
                                <label for="select-y">Изменение Y:</label>
                                <input 
                                    type="text" 
                                    id="select-y"
                                    name="coordinate__y"
                                    pattern="-?[0-9]+"
                                    title="Указанное значение должно быть числом"
                                    aria-errormessage="select-y-errors"
                                    required   
                                >
                                <span id="select-y-errors" class="field__errors" data-js-form-field-errors></span>
                            </p>

                            <div class="field">
                                <p>Изменение R:</p>
                                <ul type="none">
                                    <li><button type="button" id="button-r" class="button-R" value="1">1</button></li>
                                    <li><button name="btn-R-field" type="button" class="button-R" value="2">2</button></li>
                                    <li><button name="btn-R-field" type="button" class="button-R" value="3">3</button></li>
                                    <li><button name="btn-R-field" type="button" class="button-R" value="4">4</button></li>
                                    <li><button name="btn-R-field" type="button" class="button-R" value="5">5</button></li>
                                </ul>
                                <input type="hidden" id="select-r" name="selection-r" aria-errormessage="select-r-errors" required>
                                <br>
                                <span class="field__errors" id="select-r-errors" data-js-form-field-errors></span>
                            </div>

                            <div id="btn-shoot-wrapper">
                                <button type="submit">ВЫСТРЕЛ!</button>
                            </div>

                        </fieldset>
                    </form>
                </td>

                <td>
                    <canvas id="canvas-graphics" width="400" height="400"></canvas>
                </td>

                <td>
                    <table>
                        <thead>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>X</th>
                            <th>Y</th>
                            <th>R</th>
                            <th>Результат</th>
                        </thead>
                        <tbody>     </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>

    <script src="./script.js"></script>

</body>
</html>
