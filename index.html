<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Sen:wght@400..800&display=swap');

        :root {
            --input-field-max-width: 40px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: rgb(0, 35, 110);
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        
        .noto-sans-font {
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }

        input, select, button {
            background-color: inherit;
            font-family: inherit;
            font-weight: inherit;
            border: none;
        }

        form {
            margin: 0;
            padding: 0;
            text-align: left;
        }

        fieldset {
            /* border: 1px solid black; */
            padding-inline: 30px;
        }

        legend {
            text-align: center;
        }

        table {
            table-layout: fixed;
            width: 100%;
            border: black 1px solid;
        }

        thead {
            font-family: monospace;
            font-size: 32px;
            background-color: #7dc4ff;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.15);
        }

        tbody {
            font-size: 24px;
        }

        td {
            width: min-content;
            padding: 15px;
            border: 1px solid black;
        }

        thead tr td:first-child {
            text-align: center;
        }

        thead tr td:nth-child(2) {
            text-align: center;
        }

        thead tr td:last-child {
            text-align: right;
        }

        tbody tr td {
            padding-block: 100px;
            /* display: flex; */
            text-align: center;
        }
        
        #select-x, #select-y {
            min-width: var(--input-field-max-width);
            width: calc(var(--input-field-max-width) + 15px);
            font-size: 20px;
            padding: 5px;
            background-color: #dadada;
            border-radius: 5px;
            border: 1px solid white;
        }

        #select-y {
            width: calc(var(--input-field-max-width) + 5px);
        }
        
        select option {
            font-size: 20px;
        }  

        ul {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-evenly;
        }

        li button {
            width: 3em;
            font-size: 24px;
        }

        #btn-shoot-wrapper {
            display: flex;
            justify-content: center;
            
        }

        #btn-shoot-wrapper button {
            font-size: 24px; 
            padding: 15px 25px;
        }

        button {
            background-color: #81b3ff;
            border-radius: 5px;
            color: rgb(0, 27, 58);
            transition: 0.4s;
        }

        button:hover {
            scale: 1.1;
            box-shadow: 0px 8px 10px rgba(0,0,0,0.15);
            background-color: #a2c7ff
        }

    </style>
</head>
<body>
    
    <table>
        <thead>
            <tr>
                <td>Саньков Андрей Андреевич</td>
                <td>Вариант: 12695</td>
                <td>Группа: P3212</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <form>
                        <fieldset>
                            <legend>Параметры выстрела</legend>
                            <p>
                                <label for="select-x">Изменение X:</label>
                                <select name="coordinate-x" id="select-x">
                                    <option value="" disabled selected></option>
                                    <option value="-3">-3</option>
                                    <option value="-2">-2</option>
                                    <option value="-1">-1</option>
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </p>

                            <p>
                                <label for="select-y">Изменение Y:</label>
                                <input type="text" id="select-y">
                            </p>

                            <p>
                                <p>Изменение R:</p>
                                <ul type="none">
                                    <li><button type="button" id="button-r">1</button></li>
                                    <li><button type="button">2</button></li>
                                    <li><button type="button">3</button></li>
                                    <li><button type="button">4</button></li>
                                    <li><button type="button">5</button></li>
                                </ul>
                            </p>

                            <div id="btn-shoot-wrapper">
                                <button type="submit">ВЫСТРЕЛ!</button>
                            </div>

                        </fieldset>
                    </form>
                </td>
                <td>
                    <canvas id="canvas-graphics" width="400" height="400""></canvas>
                </td>
                <td>1</td>
            </tr>
        </tbody>
    </table>

    <script src="./script.js"></script>

</body>
</html>
