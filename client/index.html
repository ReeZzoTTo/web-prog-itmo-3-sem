<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-программирование | ЛР №1</title>

    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    
    <header class="header">
        <p class="header-data">Саньков Андрей Андреевич</p>
        <p class="header-data">Вариант: 631</p>
        <p class="header-data">Группа: P3212</p>
    </header>

    <main class="main">

        <section class="main-section">
            <form id="shoot__form" novalidate data-js-shoot-form>
                <fieldset class="shoot-form-fieldset">
                    <legend class="shoot-form-legend">Параметры выстрела</legend>
                    
                    <div class="field">

                        <label class="field-label">Изменение X:</label>

                        <ul class="button-X-list">
                            <li><button type="button" class="button-X" value="-4">-4</button></li>
                            <li><button type="button" class="button-X" value="-3">-3</button></li>
                            <li><button type="button" class="button-X" value="-2">-2</button></li>
                            <li><button type="button" class="button-X" value="-1">-1</button></li>
                            <li><button type="button" class="button-X" value="0">0</button></li>
                            <li><button type="button" class="button-X" value="1">1</button></li>
                            <li><button type="button" class="button-X" value="2">2</button></li>
                            <li><button type="button" class="button-X" value="3">3</button></li>
                            <li><button type="button" class="button-X" value="4">4</button></li>
                        </ul>
                        <div class="field__errors" data-js-form-field-errors data-js-select-x-errors>
                            
                        </div>
                    </div>

                    <p class="field">
                        <label for="select-y" class="field-label">Изменение Y:</label>
                        <input 
                            type="text" 
                            id="select-y"
                            name="coordinate__y"
                            pattern="-?[0-9]*\.?[0-9]+"
                            title="Указанное значение должно быть числом"
                            aria-errormessage="select-y-errors"
                            required   
                        >
                        <span id="select-y-errors" class="field__errors" data-js-form-field-errors></span>
                    </p>

                    <p class="field">

                        <label class="field-label">Изменение R:</label>
                        
                        <ul class="radio-list">
                            <li>
                                <input type="radio" name="select-r" id="r-1" value="1">
                                <label for="r-1">1</label>
                            </li>
                            <li>
                                <input type="radio" name="select-r" id="r-1.5" value="1.5">
                                <label for="r-1.5">1.5</label>
                            </li>
                            <li>
                                <input type="radio" name="select-r" id="r-2" value="2">
                                <label for="r-2">2</label>
                            </li>
                            <li>
                                <input type="radio" name="select-r" id="r-2.5" value="2.5">
                                <label for="r-2.5">2.5</label>
                            </li>
                            <li>
                                <input type="radio" name="select-r" id="r-3" value="3" checked>
                                <label for="r-3">3</label>
                            </li>

                        </ul>
                        
                    </p>

                    <div class="btn-shoot-wrapper">
                        <button type="submit" class="button-shoot">ВЫСТРЕЛ!</button>
                    </div>

                </fieldset>
            </form>
        </section>

        <section class="main-section">
            <canvas id="canvas-graphics" width="400" height="400"></canvas>
        </section>

        <section class="main-section">
            <div class="shoots-table-wrapper">
                <table class="shoots-table">
                    <thead class="shoot-table-header">
                        <tr class="shoot-table-row">
                            <th>Дата</th>
                            <th>Время</th>
                            <th>X</th>
                            <th>Y</th>
                            <th>R</th>
                            <th>Результат</th>
                        </tr>
                    </thead>
                    <tbody class="shoot-list" data-js-shoot-list>
                        <!-- JavaScript code -->
                    </tbody>
                </table>
            </div>
            <div class="clear-button-wrapper">
                <button type="button" class="clear-button" data-js-clear-button>Очистить таблицу</button>
            </div>
        </section>

    </main>

    <!-- <script src="./src/modules/ButtonHandler.js" type="module"></script>
    <script src="./src/modules/CanvasGraphics.js" type="module"></script>
    <script src="./src/modules/FormButtonSelection.js" type="module"></script>
    <script src="./src/modules/FormValidation.js" type="module"></script>
    <script src="./src/modules/ShootsTable.js" type="module"></script>
    <script src="./src/index.js" type="module" type="module"></script> -->

    <script src="./src/script.js" type="module"></script>

</body>
</html>
